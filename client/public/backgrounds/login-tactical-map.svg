<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="subdued hex tactical map background">
  <defs>
    <pattern id="hex" width="52" height="45" patternUnits="userSpaceOnUse">
      <path d="M13 1H39L52 22.5 39 44H13L0 22.5Z" fill="none" stroke="#d8e0dc" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <pattern id="small-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1.1" fill="#80e6d5" opacity=".12"/>
    </pattern>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="fog" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .024" numOctaves="3" seed="19"/>
      <feColorMatrix type="matrix" values="1 0 0 0 0.86 0 1 0 0 0.9 0 0 1 0 0.88 0 0 0 .58 0"/>
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <linearGradient id="map-light" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f2f4f0" stop-opacity=".08"/>
      <stop offset=".44" stop-color="#edf3ef" stop-opacity=".18"/>
      <stop offset="1" stop-color="#edf3ef" stop-opacity=".04"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="58%" cy="46%" r="58%">
      <stop offset="0" stop-color="#edf3ef" stop-opacity=".18"/>
      <stop offset=".38" stop-color="#80e6d5" stop-opacity=".055"/>
      <stop offset="1" stop-color="#050707" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="#050707"/>
  <rect width="1920" height="1080" fill="url(#center-glow)"/>
  <rect x="-60" y="-30" width="2040" height="1140" fill="url(#hex)"/>
  <rect width="1920" height="1080" fill="url(#small-dots)"/>

