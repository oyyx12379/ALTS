  <g opacity=".12" fill="#edf3ef">
    <path d="M0 0h42v42H0zM52 0h58v58H52zM138 0h68v68H138zM250 0h78v78H250zM374 0h54v54H374zM482 0h72v72H482zM626 0h68v68H626zM742 0h92v92H742zM902 0h64v64H902zM1038 0h84v84H1038zM1198 0h58v58H1198zM1322 0h76v76H1322zM1468 0h104v104H1468zM1638 0h82v82H1638zM1798 0h122v122H1798z"/>
